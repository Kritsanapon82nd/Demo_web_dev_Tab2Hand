server {
  listen 80;
  client_max_body_size 25m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }
  location / {
    sub_filter '</body>' '<script src="/site-nav.js" defer></script></body>';
    sub_filter_once on;
    try_files $uri $uri/ /index.html;
  }
}
